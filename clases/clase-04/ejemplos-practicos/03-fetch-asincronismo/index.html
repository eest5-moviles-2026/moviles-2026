<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 03: Fetch Asíncrono y Promise.all</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #090d16;
            color: #e2e8f0;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        .actions {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        button {
            cursor: pointer;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.secundario {
            background: #334155;
        }
        .loading {
            color: #38bdf8;
            font-style: italic;
            margin: 1rem 0;
        }
        .error {
            background: #7f1d1d;
            color: #fecaca;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        .oculto {
            display: none;
        }
        .lista-posts {
            display: grid;
            gap: 0.75rem;
        }
        .post-card {
            background: #1e293b;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 SocialAPI (Demo Fetch, Async/Await y Promise.all)</h1>
        <p>Este laboratorio descarga datos reales de la API pública <code>jsonplaceholder.typicode.com</code>.</p>

        <div class="actions">
            <button id="btn-fetch-secuencial">⏱️ Descargar Usuarios (1 petición)</button>
            <button id="btn-fetch-paralelo" class="secundario">🚀 Descargar Usuarios + Posts con Promise.all (Paralelo)</button>
        </div>

        <div id="estado-carga" class="loading oculto">⏳ Descargando datos desde el servidor remoto...</div>
        <div id="estado-error" class="error oculto"></div>

        <div id="resultado-contenedor" class="lista-posts"></div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
