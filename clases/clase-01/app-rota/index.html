<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Promedios - Técnica 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Calculadora de Promedios 🎓</h1>
        <p class="subtitle">Ingresá tus notas para saber si aprobás la materia</p>
        
        <div class="input-group">
            <label for="nota1">Primer Trimestre:</label>
            <input type="number" id="nota1" min="1" max="10" placeholder="Ej: 7">
        </div>
        
        <div class="input-group">
            <label for="nota2">Segundo Trimestre:</label>
            <input type="number" id="nota2" min="1" max="10" placeholder="Ej: 8">
        </div>
        
        <div class="input-group">
            <label for="nota3">Tercer Trimestre:</label>
            <input type="number" id="nota3" min="1" max="10" placeholder="Ej: 6">
        </div>
        
        <button id="btn-calcular">Calcular Promedio</button>
        
        <div id="resultado" class="result-box hidden">
            <p>Tu promedio es: <span id="promedio-valor">0</span></p>
            <p id="estado-mensaje"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
